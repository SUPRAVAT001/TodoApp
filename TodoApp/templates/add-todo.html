{% extends "layout.html" %}
{% block title %}Add Todo — TodoApp{% endblock %}

{% block content %}
<div class="main-container">
  <div class="page-header">
    <div>
      <h1>Add New Todo</h1>
      <p>Fill in the details to create a new task.</p>
    </div>
    <a href="/" class="btn btn-outline-secondary">&larr; Back to Home</a>
  </div>

  <div class="form-card">
    <div class="card">
      <div class="card-header">New Task</div>
      <div style="padding:1.75rem;">
        <form action="/todos/add-todo" method="post" class="js-loading-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

          <div class="mb-3">
            <label class="form-label" for="title">Title <span style="color:var(--danger)">*</span></label>
            <input type="text" id="title" name="title"
                   class="form-control" placeholder="e.g. Buy groceries"
                   value="{{ form_data.title if form_data else '' }}"
                   minlength="3" maxlength="100" required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="description">Description <span style="color:var(--danger)">*</span></label>
            <textarea id="description" name="description"
                      class="form-control" rows="3"
                      placeholder="Briefly describe the task..."
                      minlength="3" maxlength="300" required>{{ form_data.description if form_data else '' }}</textarea>
          </div>

          <div class="mb-3">
            <label class="form-label" for="priority">Priority</label>
            {% set sel_p = form_data.priority if form_data else 3 %}
            <select id="priority" name="priority" class="form-control priority-select">
              <option value="1" {% if sel_p == 1 %}selected{% endif %}>1 — Very Low</option>
              <option value="2" {% if sel_p == 2 %}selected{% endif %}>2 — Low</option>
              <option value="3" {% if sel_p == 3 %}selected{% endif %}>3 — Medium</option>
              <option value="4" {% if sel_p == 4 %}selected{% endif %}>4 — High</option>
              <option value="5" {% if sel_p == 5 %}selected{% endif %}>5 — Critical</option>
            </select>
          </div>

          <div class="mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox"
                     id="complete" name="complete" value="true"
                     {% if form_data and form_data.complete %}checked{% endif %}>
              <label class="form-check-label" for="complete">Mark as completed</label>
            </div>
          </div>

          <div style="display:flex;gap:.75rem;">
            <button type="submit" class="btn btn-primary btn-lg flex-fill" data-loading-text="Adding...">Add Todo</button>
            <a href="/" class="btn btn-outline-secondary btn-lg">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
