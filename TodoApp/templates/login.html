<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TodoApp</title>
  <link rel="stylesheet" href="/static/css/bootstrap.css">
  <link rel="stylesheet" href="/static/css/base.css">
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="brand">
        <h2>TodoApp</h2>
        <p>Sign in to manage your tasks</p>
      </div>

      {% if msg %}
      <div class="alert alert-{{ msg_type | default('danger') }}" role="alert">{{ msg }}</div>
      {% endif %}

      <form action="/auth/login" method="post" class="js-loading-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <div class="mb-3">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" name="username" class="form-control" placeholder="you@example.com"
            value="{{ entered_email | default('') }}" autocomplete="email" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
            autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" data-loading-text="Signing in...">Sign
          In</button>
      </form>

      <div class="auth-divider">or</div>

      <div style="text-align:center;font-size:.9rem;color:var(--text-muted);">
        Don't have an account?
        <a href="/auth/register" style="font-weight:600;">Create one &rarr;</a>
      </div>

    </div>
  </div>
  <script src="/static/js/jquery-slim.js"></script>
  <script src="/static/js/bootstrap.js"></script>
  <script src="/static/js/todos.js"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "6696a425d80b45c7a80bdb9f24b3ee1a"}'></script><!-- End Cloudflare Web Analytics -->
</body>

</html>
