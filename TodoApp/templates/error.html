{% extends "layout.html" %}
{% block title %}{{ title | default('Error') }} — TodoApp{% endblock %}

{% block content %}
<div class="main-container">
  <div class="card" style="max-width:520px;margin:3rem auto;text-align:center;padding:2.5rem 2rem;">
    <h1 style="font-size:2.5rem;font-weight:800;color:var(--danger);margin-bottom:.5rem;">
      {{ status_code | default(403) }}
    </h1>
    <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:.75rem;">{{ title | default('Access Denied') }}</h2>
    <p style="color:var(--text-muted);margin-bottom:1.5rem;">{{ message }}</p>
    <a href="/" class="btn btn-primary">&larr; Return to Home</a>
  </div>
</div>
{% endblock %}
